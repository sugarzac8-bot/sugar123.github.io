    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
    <a href="mailto:info@mautodetailing.eu">Contact</a>
  </div>
</footer>

<script>
emailjs.init(nPswXH--cvTlRjPFo);
const hamburger=document.getElementById('hamburger');
const mobileMenu=document.getElementById('mobileMenu');
hamburger.addEventListener('click',()=>{hamburger.classList.toggle('open');mobileMenu.classList.toggle('open');});
function closeMenu(){hamburger.classList.remove('open');mobileMenu.classList.remove('open');}
function isValidEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function sendBooking(){
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const service=document.getElementById('f-service').value;
  const btn=document.getElementById('submitBtn');
  const toast=document.getElementById('formToast');
  let valid=true;
  ['name','email','service'].forEach(f=>{
    const el=document.getElementById('f-'+f);
    if(el)el.classList.remove('error');
    document.getElementById('err-'+f).classList.remove('show');
  });
  document.getElementById('f-service').style.borderColor='';
  toast.className='form-toast';toast.textContent='';
  if(!name){document.getElementById('err-name').classList.add('show');document.getElementById('f-name').classList.add('error');valid=false;}
  if(!email||!isValidEmail(email)){document.getElementById('err-email').classList.add('show');document.getElementById('f-email').classList.add('error');valid=false;}
  if(!service){document.getElementById('err-service').classList.add('show');document.getElementById('f-service').style.borderColor='#e84444';valid=false;}
  if(!valid)return;
  btn.disabled=true;btn.textContent='Sending...';
  emailjs.send(service_6e3db79,template_0ika7ts,{
    to_email:'info@mautodetailing.eu',
    from_name:name,
    from_email:email,
    phone:phone||'Not provided',
    service:service,
    reply_to:email
  }).then(()=>{
    toast.textContent="Your booking request has been sent! We'll be in touch shortly.";
    toast.className='form-toast success';
    btn.textContent='Sent!';
    document.getElementById('f-name').value='';
    document.getElementById('f-phone').value='';
    document.getElementById('f-email').value='';
    document.getElementById('f-service').selectedIndex=0;
    setTimeout(()=>{btn.disabled=false;btn.textContent='Send Booking Request →';},4000);
  }).catch(()=>{
    toast.textContent='Something went wrong. Please email us directly at info@mautodetailing.eu';
    toast.className='form-toast error-msg';
    btn.disabled=false;btn.textContent='Send Booking Request →';
  });
}
</script>
</body>
</html>
