<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Auto Detailing</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --black:#0A0A0A;--dark:#111111;--panel:#161616;--border:#2A2A2A;
  --text:#F0EDE8;--muted:#888480;--orange:#E85D26;--orange-dim:#7A2F10;--white:#FAFAF8;
  --blue:#1AADCE;
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--text);overflow-x:hidden;}

/* NAV */
nav{position:fixed;top:0;width:100%;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 48px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.92);backdrop-filter:blur(16px);}
.nav-logo img{height:48px;width:48px;border-radius:50%;object-fit:cover;}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{text-decoration:none;color:var(--muted);font-size:0.82rem;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;transition:color 0.2s;}
.nav-links a:hover{color:var(--text);}
.nav-cta{background:var(--orange);color:white;padding:10px 24px;border-radius:6px;font-size:0.82rem;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;text-decoration:none;transition:background 0.2s,transform 0.15s;}
.nav-cta:hover{background:#c44d1e;transform:translateY(-1px);}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--text);transition:all 0.3s;}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.mobile-menu{display:none;position:fixed;top:77px;left:0;right:0;background:var(--dark);border-bottom:1px solid var(--border);padding:20px 24px;flex-direction:column;gap:0;z-index:99;}
.mobile-menu.open{display:flex;}
.mobile-menu a{text-decoration:none;color:var(--muted);font-size:0.9rem;font-weight:500;padding:14px 0;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.8px;transition:color 0.2s;}
.mobile-menu a:last-child{border-bottom:none;}
.mobile-menu a:hover{color:var(--text);}
.mobile-menu .mobile-book{margin-top:16px;background:var(--orange);color:white;padding:14px;border-radius:6px;text-align:center;font-weight:600;font-size:0.85rem;border-bottom:none;}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:120px 48px 72px;
  position:relative;overflow:hidden;
}

/* Car background using Unsplash */
.hero-bg-img{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1607860108855-64acf2078ed9?w=1600&q=80&auto=format&fit=crop');
  background-size:cover;background-position:center 40%;
  filter:brightness(0.28) saturate(0.7);
}
.hero-overlay{
  position:absolute;inset:0;
    linear-gradient(to right, rgba(10,10,10,0.92) 40%, rgba(10,10,10,0.3) 100%),
    linear-gradient(to top, rgba(10,10,10,0.98) 0%, transparent 50%);
}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);background-size:60px 60px;}

/* Logo in hero */
.hero-logo{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:18px;
  margin-bottom:32px;
}
.hero-logo img{
  height:90px;width:90px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(26,173,206,0.4);
  box-shadow:0 0 32px rgba(26,173,206,0.2);
}
.hero-logo-text{display:flex;flex-direction:column;}
.hero-logo-name{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;
  color:var(--white);letter-spacing:1px;line-height:1;
}
.hero-logo-name span{color:var(--blue);}
.hero-logo-sub{font-size:0.72rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:5px;}

.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:0.72rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--orange);border:1px solid var(--orange-dim);padding:7px 16px;border-radius:4px;margin-bottom:24px;width:fit-content;position:relative;z-index:2;}
.hero-badge::before{content:'';width:6px;height:6px;background:var(--orange);border-radius:50%;display:inline-block;}

.hero-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(3.4rem,7.5vw,7.5rem);line-height:0.92;letter-spacing:-2px;color:var(--white);margin-bottom:32px;position:relative;z-index:2;}
.hero-title em{font-style:normal;-webkit-text-stroke:1.5px var(--orange);color:transparent;}

.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;position:relative;z-index:2;flex-wrap:wrap;}
.hero-sub{font-size:0.95rem;color:var(--muted);line-height:1.75;max-width:380px;font-weight:300;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.btn-main{background:var(--orange);color:white;padding:15px 32px;border-radius:6px;font-size:0.88rem;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;text-decoration:none;transition:background 0.2s,transform 0.15s;white-space:nowrap;}
.btn-main:hover{background:#c44d1e;transform:translateY(-2px);}
.btn-ghost{border:1px solid var(--border);color:var(--muted);padding:15px 32px;border-radius:6px;font-size:0.88rem;font-weight:500;letter-spacing:0.5px;text-transform:uppercase;text-decoration:none;transition:all 0.2s;white-space:nowrap;}
.btn-ghost:hover{border-color:var(--muted);color:var(--text);}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--dark);}
.stat-item{padding:28px 32px;border-right:1px solid var(--border);}
.stat-item:last-child{border-right:none;}
.stat-num{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:var(--white);line-height:1;margin-bottom:6px;}
.stat-num span{color:var(--orange);}
.stat-label{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:500;}

/* SERVICES */
.services{padding:96px 48px;background:var(--black);}
.section-label{font-size:0.72rem;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange);margin-bottom:16px;display:block;}
.section-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,3.2rem);line-height:1;color:var(--white);margin-bottom:56px;letter-spacing:-1px;}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.service-card{padding:36px 32px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background 0.25s;cursor:pointer;}
.service-card:hover{background:var(--panel);}
.service-card:nth-child(3n){border-right:none;}
.service-card:nth-child(4),.service-card:nth-child(5),.service-card:nth-child(6){border-bottom:none;}
.service-icon-wrap{width:44px;height:44px;border-radius:8px;background:rgba(232,93,38,0.12);display:flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:20px;}
.service-name{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;color:var(--white);margin-bottom:10px;}
.service-desc{font-size:0.82rem;color:var(--muted);line-height:1.65;margin-bottom:18px;}
.service-price{font-size:0.85rem;font-weight:600;color:var(--orange);display:flex;align-items:center;gap:6px;}
.service-price::before{content:'';display:block;width:16px;height:1px;background:var(--orange);}

/* WHY */
.why{padding:96px 48px;background:var(--dark);border-top:1px solid var(--border);}
.why-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.why-features{display:flex;flex-direction:column;}
.why-feature{display:flex;align-items:flex-start;gap:20px;padding:24px 0;border-bottom:1px solid var(--border);}
.why-feature:first-child{border-top:1px solid var(--border);}
.why-num{font-family:'Syne',sans-serif;font-size:0.75rem;font-weight:700;color:var(--orange);width:28px;flex-shrink:0;margin-top:3px;letter-spacing:1px;}
.why-feature-title{font-weight:600;font-size:0.92rem;color:var(--white);margin-bottom:5px;}
.why-feature-desc{font-size:0.82rem;color:var(--muted);line-height:1.6;}
.why-right{display:flex;flex-direction:column;gap:16px;}
.why-big-stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:40px;position:relative;overflow:hidden;}
.why-big-stat::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle, rgba(232,93,38,0.15) 0%, transparent 70%);border-radius:50%;}
.why-big-num{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;color:var(--white);line-height:1;margin-bottom:8px;}
.why-big-num span{color:var(--orange);}
.why-big-label{font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
.why-small-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.why-small{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;}
.why-small-num{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--white);line-height:1;margin-bottom:6px;}
.why-small-num span{color:var(--orange);}
.why-small-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}

/* BOOKING */
.booking{padding:96px 48px;background:var(--black);border-top:1px solid var(--border);}
.booking-inner{max-width:780px;margin:0 auto;text-align:center;}
.booking-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.4rem,5vw,4rem);color:var(--white);margin-bottom:14px;letter-spacing:-1.5px;line-height:1;}
.booking-title span{color:var(--orange);}
.booking-sub{font-size:0.92rem;color:var(--muted);margin-bottom:48px;font-weight:300;}
.booking-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-input,.form-select{width:100%;padding:16px 20px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.2s;}
.form-input:focus,.form-select:focus{border-color:var(--orange);}
.form-input::placeholder{color:var(--muted);}
.form-input.error{border-color:#e84444;}
.form-select option{background:var(--dark);color:var(--text);}
.field-error{font-size:0.75rem;color:#e84444;margin-top:4px;padding-left:4px;display:none;}
.field-error.show{display:block;}
.btn-submit{width:100%;padding:17px;background:var(--orange);color:white;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s,transform 0.15s;margin-top:4px;}
.btn-submit:hover:not(:disabled){background:#c44d1e;transform:translateY(-2px);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;}
.form-toast{display:none;padding:16px 20px;border-radius:8px;font-size:0.88rem;font-weight:500;text-align:center;margin-top:4px;}
.form-toast.success{display:block;background:rgba(30,160,80,0.15);border:1px solid rgba(30,160,80,0.4);color:#4ecf82;}
.form-toast.error-msg{display:block;background:rgba(232,68,68,0.12);border:1px solid rgba(232,68,68,0.35);color:#e84444;}

/* FOOTER */
footer{border-top:1px solid var(--border);background:var(--dark);padding:28px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-left{display:flex;align-items:center;gap:14px;}
.footer-left img{height:38px;width:38px;border-radius:50%;object-fit:cover;border:1px solid rgba(26,173,206,0.3);}
.footer-logo-text{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;letter-spacing:1px;color:var(--white);}
.footer-logo-text span{color:var(--blue);}
.footer-copy{font-size:0.78rem;color:var(--muted);}
.footer-links{display:flex;gap:24px;}
.footer-links a{font-size:0.78rem;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:1px;font-weight:500;}
.footer-links a:hover{color:var(--text);}

/* MOBILE */
@media(max-width:900px){
  .services-grid{grid-template-columns:1fr 1fr;}
  .service-card:nth-child(3n){border-right:1px solid var(--border);}
  .service-card:nth-child(2n){border-right:none;}
  .service-card:nth-child(3){border-bottom:1px solid var(--border);}
  .service-card:nth-child(4){border-bottom:1px solid var(--border);}
  .service-card:nth-child(5),.service-card:nth-child(6){border-bottom:none;}
  .why-inner{grid-template-columns:1fr;gap:48px;}
  .form-row{grid-template-columns:1fr;}
  .stats-bar{grid-template-columns:repeat(2,1fr);}
  .stat-item:nth-child(2){border-right:none;}
  .stat-item:nth-child(3){border-right:1px solid var(--border);}
  .stat-item:nth-child(1),.stat-item:nth-child(2){border-bottom:1px solid var(--border);}
}
@media(max-width:640px){
  nav{padding:12px 20px;}
  .nav-links,.nav-cta{display:none;}
  .hamburger{display:flex;}
  .hero{padding:90px 20px 56px;}
  .hero-logo img{height:68px;width:68px;}
  .hero-logo-name{font-size:1.15rem;}
  .hero-title{font-size:3rem;letter-spacing:-1px;}
  .hero-bottom{flex-direction:column;align-items:flex-start;gap:28px;}
  .services{padding:64px 20px;}
  .services-grid{grid-template-columns:1fr;border-radius:8px;}
  .service-card{border-right:none !important;}
  .service-card:nth-child(n){border-bottom:1px solid var(--border) !important;}
  .service-card:last-child{border-bottom:none !important;}
  .why{padding:64px 20px;}
  .why-small-stats{grid-template-columns:repeat(4,1fr);}
  .why-small{padding:14px 8px;text-align:center;}
  .why-small-num{font-size:1.3rem;}
  .why-big-num{font-size:3.5rem;}
  .booking{padding:64px 20px;}
  footer{padding:24px 20px;flex-direction:column;align-items:center;text-align:center;}
  .footer-links{justify-content:center;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    <img src="/mnt/user-data/uploads/Adobe_Express_-_file.png" alt="M-Auto Detailing Logo" />
  </div>
  <ul class="nav-links">
    <li><a href="#services">Services</a></li>
    <li><a href="#why">About</a></li>
    <li><a href="#booking">Book</a></li>
  </ul>
  <a href="#booking" class="nav-cta">Book Now</a>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="#services" onclick="closeMenu()">Services</a>
  <a href="#why" onclick="closeMenu()">About</a>
  <a href="#booking" onclick="closeMenu()">Book</a>
  <a href="#booking" class="mobile-book" onclick="closeMenu()">Book Now</a>
</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg-img"></div>
  <div class="hero-overlay"></div>
  <div class="hero-grid"></div>

  <div class="hero-logo">
    <img src="/mnt/user-data/uploads/Adobe_Express_-_file.png" alt="M-Auto Detailing" />
    <div class="hero-logo-text">
      <div class="hero-logo-name">M-Auto <span>Detailing</span></div>
      <div class="hero-logo-sub">By G.Z · Est. 2025 · Cyprus</div>
    </div>
  </div>

  <div class="hero-badge">Premium Car Detailing · Cyprus</div>
  <h1 class="hero-title">Detail<br>that makes<br>you <em>look twice.</em></h1>
  <div class="hero-bottom">
    <p class="hero-sub">Professional-grade detailing services that restore, protect, and transform your vehicle — inside and out.</p>
    <div class="hero-actions">
      <a href="#booking" class="btn-main">Book a Detail</a>
      <a href="#services" class="btn-ghost">View Services</a>
    </div>
  </div>
</section>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-item"><div class="stat-num">100<span>+</span></div><div class="stat-label">Cars Detailed</div></div>
  <div class="stat-item"><div class="stat-num">5<span>★</span></div><div class="stat-label">Average Rating</div></div>
  <div class="stat-item"><div class="stat-num">1<span>yr</span></div><div class="stat-label">In Business</div></div>
  <div class="stat-item"><div class="stat-num">100<span>%</span></div><div class="stat-label">Satisfaction Rate</div></div>
</div>

<!-- SERVICES -->
<section class="services" id="services">
  <span class="section-label">What We Offer</span>
  <h2 class="section-title">Our Services</h2>
  <div class="services-grid">
    <div class="service-card"><div class="service-icon-wrap">🫧</div><div class="service-name">Exterior Wash</div><p class="service-desc">Full hand wash, wheel clean, tire shine, and streak-free window polish.</p><div class="service-price">From €30</div></div>
    <div class="service-card"><div class="service-icon-wrap">🧹</div><div class="service-name">Interior Detail</div><p class="service-desc">Deep vacuum, dashboard wipe-down, upholstery clean, and odour removal.</p><div class="service-price">From €50</div></div>
    <div class="service-card"><div class="service-icon-wrap">✨</div><div class="service-name">Full Detail</div><p class="service-desc">Our signature inside-out treatment. Every nook and cranny, done right.</p><div class="service-price">From €99</div></div>
    <div class="service-card"><div class="service-icon-wrap">🛡️</div><div class="service-name">Paint Protection</div><p class="service-desc">Ceramic coating or wax seal to protect your paint from UV, rain, and dirt.</p><div class="service-price">From €80</div></div>
    <div class="service-card"><div class="service-icon-wrap">🔆</div><div class="service-name">Headlight Restore</div><p class="service-desc">Polish away yellowing and restore crystal-clear visibility to your lights.</p><div class="service-price">From €25</div></div>
    <div class="service-card"><div class="service-icon-wrap">🚙</div><div class="service-name">Engine Bay Clean</div><p class="service-desc">Safe, thorough degreasing that makes your engine bay look factory fresh.</p><div class="service-price">From €40</div></div>
  </div>
</section>

<!-- WHY -->
<section class="why" id="why">
  <div class="why-inner">
    <div class="why-text">
      <span class="section-label">Why M-Auto</span>
      <h2 class="section-title">Detailing done right.</h2>
      <div class="why-features">
        <div class="why-feature"><div class="why-num">01</div><div><div class="why-feature-title">Friendly & Approachable</div><div class="why-feature-desc">No jargon, no pressure — just honest advice and outstanding results every time.</div></div></div>
        <div class="why-feature"><div class="why-num">02</div><div><div class="why-feature-title">Professional-Grade Products</div><div class="why-feature-desc">We use only premium, car-safe products that genuinely protect your investment.</div></div></div>
        <div class="why-feature"><div class="why-num">03</div><div><div class="why-feature-title">Mobile Service Available</div><div class="why-feature-desc">We come to you — at home, at the office, wherever is most convenient.</div></div></div>
        <div class="why-feature"><div class="why-num">04</div><div><div class="why-feature-title">Satisfaction Guaranteed</div><div class="why-feature-desc">Not satisfied? We make it right — no questions asked, full stop.</div></div></div>
      </div>
    </div>
    <div class="why-right">
      <div class="why-big-stat">
        <div class="why-big-num">100<span>+</span></div>
        <div class="why-big-label">Cars Detailed & Counting</div>
      </div>
      <div class="why-small-stats">
        <div class="why-small"><div class="why-small-num">5<span>★</span></div><div class="why-small-label">Rating</div></div>
        <div class="why-small"><div class="why-small-num">1<span>yr</span></div><div class="why-small-label">Experience</div></div>
        <div class="why-small"><div class="why-small-num">100<span>%</span></div><div class="why-small-label">Satisfaction</div></div>
        <div class="why-small"><div class="why-small-num">6<span>+</span></div><div class="why-small-label">Services</div></div>
      </div>
    </div>
  </div>
</section>

<!-- BOOKING -->
<section class="booking" id="booking">
  <div class="booking-inner">
    <h2 class="booking-title">Book your <span>detail.</span></h2>
    <p class="booking-sub">Ready for a showroom finish? Fill in below and we'll be in touch within the hour.</p>
    <div class="booking-form">
      <div class="form-row">
        <div>
          <input class="form-input" type="text" id="f-name" placeholder="Your Name *" />
          <div class="field-error" id="err-name">Please enter your name.</div>
        </div>
        <div>
          <input class="form-input" type="tel" id="f-phone" placeholder="Phone Number (optional)" />
        </div>
      </div>
      <div>
        <input class="form-input" type="email" id="f-email" placeholder="Your Email Address *" />
        <div class="field-error" id="err-email">Please enter a valid email address.</div>
      </div>
      <div>
        <select class="form-select" id="f-service">
          <option value="" disabled selected>Choose a Service *</option>
          <option>Exterior Wash — €30</option>
          <option>Interior Detail — €50</option>
          <option>Full Detail — €99</option>
          <option>Paint Protection — €80</option>
          <option>Headlight Restore — €25</option>
          <option>Engine Bay Clean — €40</option>
        </select>
        <div class="field-error" id="err-service">Please select a service.</div>
      </div>
      <button class="btn-submit" id="submitBtn" onclick="sendBooking()">Send Booking Request →</button>
      <div class="form-toast" id="formToast"></div>
